name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two runs at once would resolve the same version and race over the bump
# branch. Queue rather than cancel: a cancelled run leaves the branch and its
# pull request behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Refuse to release from anything but the default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${REF_NAME}."
          exit 1

      # The default branch requires a pull request, and a push made with the
      # default GITHUB_TOKEN triggers no workflow, so the bump is pushed as the
      # App instead.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}
          # Every tag, since the same-day suffix is resolved from the tags
          # already cut.
          fetch-depth: 0
          fetch-tags: true

      # The first release of a day is the bare date; every further one carries
      # the count of releases cut that day, such as `2026.10.16-2`. An empty
      # Unreleased section in CHANGELOG.md stops the release here.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: calver
          version-source: tag
          token: ${{ steps.token.outputs.token }}
          targets: |
            - file: CITATION.cff
              pattern: '^version: "{version}"$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'

      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "ci: bump version for release :rocket:"
          branch: ci/bump-version
          token: ${{ steps.token.outputs.token }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          tag: ${{ steps.bump.outputs.version }}
          target: ${{ steps.land.outputs.sha }}
          generate-notes: true
          token: ${{ steps.token.outputs.token }}

      - name: Release on GitHub
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          # A further release of a day is titled with its count, such as
          # `2026-10-16 (2)`.
          title: "{date}{count}"
          target: ${{ steps.land.outputs.sha }}
          latest: true
          token: ${{ steps.token.outputs.token }}

      - name: Explain the recovery
        if: ${{ failure() && steps.land.outputs.sha != '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          MERGE_SHA: ${{ steps.land.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::${GITHUB_REF_NAME} holds the bump ${MERGE_SHA} for ${VERSION}, but the release failed. Create release ${VERSION} on ${MERGE_SHA} by hand, or revert that commit with a pull request and run this workflow again."
